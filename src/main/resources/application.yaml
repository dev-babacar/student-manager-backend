server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/school_manager_db
    username: postgres
    password: itachi
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.babacarmane.studentmanagerbackend

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # ↑ clé secrète Base64 — minimum 256 bits pour HS256
  #   génère la tienne avec : openssl rand -hex 32
